<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support & EB AMC Grievance</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #ffffff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; }
        label { display: block; margin-top: 15px; color: #94a3b8; font-weight: bold; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 6px; box-sizing: border-box; }
        .btn-submit { background-color: #2563eb; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 20px; font-size: 16px; }
        .btn-submit:hover { background-color: #1d4ed8; }
        .btn-track { background-color: #334155; color: white; border: none; padding: 12px; width: 100%; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .status-box { display: none; margin-top: 20px; padding: 15px; background: #14532d; border-radius: 8px; border: 1px solid #16a34a; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Submit IT Team Ticket</h2>
    
    <form id="complaintForm">
        <label>Staff Name (ஸ்டாஃப் விபരം):</label>
        <input type="text" id="staffName" value="Dinesh (A.E)" required>

        <label>Section Name (பிரிவு பெயர்):</label>
        <input type="text" id="sectionName" value="North Section" required>

        <label>Faulty Component (பிரச்சனை):</label>
        <select id="component">
            <option value="Computer / Monitor Issue">Computer / Monitor Issue</option>
            <option value="Mouse Problem">Mouse Problem</option>
            <option value="RAM Problem">RAM Problem</option>
            <option value="Motherboard Problem">Motherboard Problem</option>
        </select>

        <label>Grievance Description (விபரம்) *:</label>
        <textarea id="description" rows="3" placeholder="உங்க பிரச்சனை விபரம்..." required>CRT Monitor issue</textarea>

        <button type="submit" class="btn-submit">Submit Ticket to IT Team</button>
    </form>

    <hr style="margin-top:30px; border-color:#334155;">

    <h3>🔍 Track Ticket Status (புகாரின் நிலை அறிதல்)</h3>
    <label>Enter Ticket Number:</label>
    <input type="text" id="trackId" value="EB293082">
    <button class="btn-track" onclick="trackTicket()">Check Office Database</button>

    <div id="statusBox" class="status-box">
        <!-- ஸ்டேட்டஸ் ரிசல்ட் -->
    </div>
</div>

<script>
    // ஃபார்ம் சப்மிட் செய்யும் லாஜிக்
    document.getElementById('complaintForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        // 🎯 நீங்க கேட்ட அதே மாஸ்டர் ஐடி அண்ணே!
        let ticketId = "EB293082"; 
        
        let newTicket = {
            id: ticketId,
            staff_name: document.getElementById('staffName').value,
            section_name: document.getElementById('sectionName').value,
            component: document.getElementById('component').value,
            description: document.getElementById('description').value,
            date: new Date().toLocaleDateString('en-GB'),
            status: "Pending"
        };

        // லோக்கல் மெமரியில் சேமிக்கிறோம்
        localStorage.setItem('master_ticket', JSON.stringify(newTicket));
        
        alert(`⚡ Ticket Created Successfully!\nYour Ticket ID: ${ticketId}`);
    });

    // டிக்கெட் டிராக்கிங் லாஜிக்
    function trackTicket() {
        let inputId = document.getElementById('trackId').value.trim();
        let statusBox = document.getElementById('statusBox');
        let savedTicket = JSON.parse(localStorage.getItem('master_ticket'));

        // ஒருவேளை லோக்கல்ல தரவு இல்லைனா டீஃபால்ட் விபரத்தை உருவாக்கும்
        if (!savedTicket) {
            savedTicket = {
                id: "EB293082",
                staff_name: "Dinesh (A.E)",
                section_name: "North Section",
                component: "Computer / Monitor Issue",
                description: "CRT Monitor issue",
                date: "26/06/2026",
                status: localStorage.getItem('master_status') || "Pending"
            };
            localStorage.setItem('master_ticket', JSON.stringify(savedTicket));
        }

        if (inputId === savedTicket.id || inputId === "293082") {
            statusBox.style.display = "block";
            statusBox.innerHTML = `
                <p>📌 <strong>Ticket ID:</strong> ${savedTicket.id}</p>
                <p>🟢 <strong>Status:</strong> <span style="background:#b45309; padding:4px 8px; border-radius:4px; font-weight:bold;">${savedTicket.status}</span></p>
                <p>👤 <strong>Name:</strong> ${savedTicket.staff_name}</p>
                <p>⚙️ <strong>Component:</strong> ${savedTicket.component}</p>
                <p>📝 <strong>Description:</strong> ${savedTicket.description}</p>
            `;
        } else {
            alert("டிக்கெட் எண் காணப்படவில்லை அண்ணே!");
            statusBox.style.display = "none";
        }
    }
</script>
</body>
</html>
