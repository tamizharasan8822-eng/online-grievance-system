<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support & EB AMC Grievance System</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background-color: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1); width: 100%; max-width: 600px; box-sizing: border-box; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 25px; font-size: 24px; border-bottom: 3px solid #3b82f6; padding-bottom: 10px; }
        h3 { color: #2c3e50; margin-top: 35px; margin-bottom: 15px; font-size: 20px; border-left: 4px solid #3b82f6; padding-left: 8px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; color: #34495e; font-weight: 600; font-size: 14px; }
        input[type="text"], select, textarea { width: 100%; padding: 12px; border: 1px solid #bdc3c7; border-radius: 6px; box-sizing: border-box; font-size: 14px; transition: all 0.3s; }
        input[type="text"]:focus, select:focus, textarea:focus { border-color: #3b82f6; outline: none; box-shadow: 0 0 5px rgba(59, 130, 246, 0.2); }
        textarea { resize: vertical; }
        button { width: 100%; padding: 14px; background-color: #2563eb; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.3s; margin-top: 10px; }
        button:hover { background-color: #1d4ed8; }
        .btn-track { background-color: #2c3e50; }
        .btn-track:hover { background-color: #34495e; }
        .alert { padding: 15px; border-radius: 6px; font-size: 14px; margin-top: 15px; display: none; line-height: 1.6; }
        .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert-danger { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .required-star { color: #e74c3c; margin-left: 3px; }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; color: white; }
        .badge-pending { background-color: #e67e22; }
        .badge-progress { background-color: #3498db; }
        .badge-closed { background-color: #27ae60; }
        #photoSection { display: none; background-color: #f8fafc; padding: 10px; border-radius: 6px; border: 1px dashed #3b82f6; }
    </style>
</head>
<body>

<div class="container">
    <h2>💻 IT Support (தகவல் தொழில்நுட்ப ஆதரவு)</h2>
    <form id="grievanceForm" onsubmit="submitGrievance(); return false;">
        
        <div class="form-group">
            <label for="employeeName">Employee Name / ID:<span class="required-star">*</span></label>
            <input type="text" id="employeeName" required placeholder="e.g., Surya">
        </div>

        <div class="form-group">
            <label for="sectionName">Section Name (பிரிவு பெயர்):<span class="required-star">*</span></label>
            <input type="text" id="sectionName" required placeholder="e.g., North Section">
        </div>

        <div class="form-group">
            <label for="employeePosition">Position (பதவி):<span class="required-star">*</span></label>
            <select id="employeePosition" required>
                <option value="">-- Select Position --</option>
                <option value="A.E">A.E (Assistant Engineer)</option>
                <option value="J.E">J.E (Junior Engineer)</option>
                <option value="Foreman">Foreman</option>
                <option value="Line Inspector (L.I)">Line Inspector (L.I)</option>
                <option value="Gangman">Gangman</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <div class="form-group">
            <label for="faultyComponent">Select Faulty Component:<span class="required-star">*</span></label>
            <select id="faultyComponent" required>
                <option value="">-- Select --</option>
                <option value="Collection Printer Problem">Collection Printer Problem (பிரிண்டர் பழுது)</option>
                <option value="Network Problem / Connectivity">Network Problem (நெட்வொர்க் பிரச்சனை)</option>
                <option value="Computer / Monitor Issue">Computer / Monitor Issue (கணினி பழுது)</option>
                <option value="Motherboard Problem">Motherboard Problem (மதர்போர்டு பழுது)</option>
                <option value="RAM Problem">RAM Problem (ரேம் பழுது)</option>
                <option value="SMPS Problem">SMPS Problem (பவர் சப்ளை பழுது)</option>
                <option value="Mouse / Keyboard Not Working">Mouse / Keyboard Not Working</option>
                <option value="OS Problem">OS Problem</option>
                <option value="Others">Others</option>
            </select>
        </div>

        <div class="form-group">
            <label for="breakerStatus">ELCB / RCCB Installed? (பிரேக்கர் பொருத்தப்பட்டுள்ளதா?):<span class="required-star">*</span></label>
            <select id="breakerStatus" required onchange="togglePhotoUpload()">
                <option value="">-- Select Status --</option>
                <option value="Yes">Yes (பொருத்தப்பட்டுள்ளது)</option>
                <option value="No">No (இல்லை)</option>
            </select>
        </div>

        <div class="form-group" id="photoSection">
            <label for="complaintPhoto">Upload ELCB/RCCB Photo Proof:<span class="required-star">*</span></label>
           <input type="file" id="complaintPhoto" accept="image/*" capture="environment">
        </div>

        <div class="form-group">
            <label for="earthCondition">Earth Condition in Office (அலுவலக எர்த் நிலை):<span class="required-star">*</span></label>
            <select id="earthCondition" required>
                <option value="">-- Select Earth Condition --</option>
                <option value="Good Earth Connection">Good Condition (சரியான நிலையில் உள்ளது)</option>
                <option value="Weak / High Resistance">Weak Earth (எர்த் ரெசிஸ்டன்ஸ் அதிகம்)</option>
                <option value="No Earth Link">No Earth / Open (எர்த் இணைப்பு இல்லை)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="complaintDetails">Grievance Description:<span class="required-star">*</span></label>
            <textarea id="complaintDetails" rows="4" required placeholder="Describe the problem..."></textarea>
        </div>

        <button type="submit">Submit Ticket to IT Team</button>
    </form>

    <hr style="margin-top: 30px; border: 0; border-top: 2px dashed #bdc3c7;">

    <h3>🔍 Track Ticket Status (புகாரின் நிலை அறிதல்)</h3>
    <div class="form-group">
        <label for="trackId">Enter Ticket Number:</label>
        <input type="text" id="trackId" placeholder="e.g., EB123456">
    </div>
    <button class="btn-track" onclick="trackGrievance()">Check Office Database</button>
    <div id="trackResult" class="alert"></div>
</div>

<script>
    function togglePhotoUpload() {
        const breakerStatus = document.getElementById('breakerStatus').value;
        const photoSection = document.getElementById('photoSection');
        const complaintPhoto = document.getElementById('complaintPhoto');
        if (breakerStatus === 'Yes') { photoSection.style.display = 'block'; complaintPhoto.required = true; } 
        else { photoSection.style.display = 'none'; complaintPhoto.required = false; complaintPhoto.value = ""; }
    }

    function submitGrievance() {
        const generatedId = "EB" + Math.floor(100000 + Math.random() * 900000);
        const complaintData = {
            id: generatedId,
            employeeName: document.getElementById('employeeName').value,
            sectionName: document.getElementById('sectionName').value,
            position: document.getElementById('employeePosition').value,
            faultyComponent: document.getElementById('faultyComponent').value,
            breakerStatus: document.getElementById('breakerStatus').value,
            earthCondition: document.getElementById('earthCondition').value,
            description: document.getElementById('complaintDetails').value,
            status: "Pending ⏳",
            adminClosingNotes: "",
            date: new Date().toLocaleDateString()
        };

        let localDB = JSON.parse(localStorage.getItem('eb_it_amc_db_split')) || [];
        localDB.push(complaintData);
        localStorage.setItem('eb_it_amc_db_split', JSON.stringify(localDB));

        alert(`⚡ Ticket Registered Successfully!\n\nYour Ticket ID is: ${generatedId}`);
        document.getElementById('grievanceForm').reset();
        document.getElementById('photoSection').style.display = 'none';
    }

    function trackGrievance() {
        const trackId = document.getElementById('trackId').value.trim().toUpperCase();
        const trackResult = document.getElementById('trackResult');
        if(!trackId) { alert('Please enter a Ticket ID'); return; }

        let localDB = JSON.parse(localStorage.getItem('eb_it_amc_db_split')) || [];
        const foundTicket = localDB.find(ticket => ticket.id === trackId);
        trackResult.style.display = 'block';

        if (foundTicket) {
            trackResult.className = 'alert alert-success';
            let badge = 'badge-pending';
            if(foundTicket.status.includes('Progress')) badge = 'badge-progress';
            if(foundTicket.status.includes('Closed')) badge = 'badge-closed';

            let closingNotesHTML = foundTicket.adminClosingNotes ? `<p style="color:#d35400;"><strong>🛠 Closing Remarks (Admin):</strong> ${foundTicket.adminClosingNotes}</p>` : '';

            trackResult.innerHTML = `
                <div style="text-align: left; color: #2c3e50;">
                    <p><strong>🎟 Ticket ID:</strong> <span style="color:#2563eb; font-weight:bold;">${foundTicket.id}</span></p>
                    <p><strong>🟢 Status:</strong> <span class="status-badge ${badge}">${foundTicket.status}</span></p>
                    <p><strong>👤 Name:</strong> ${foundTicket.employeeName} (${foundTicket.position})</p>
                    <p><strong>⚙️ Component:</strong> ${foundTicket.faultyComponent}</p>
                    <p><strong>📝 Description:</strong> ${foundTicket.description}</p>
                    ${closingNotesHTML}
                </div>`;
        } else {
            trackResult.className = 'alert alert-danger';
            trackResult.innerHTML = `<strong>❌ Ticket ID Not Found!</strong>`;
        }
    }
</script>
</body>
</html>
