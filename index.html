<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System & Network Complaint Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f4f6; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; margin: 20px auto; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #1d4ed8; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #4b5563; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { font-weight: normal; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .file-input-wrapper { display: flex; flex-direction: column; gap: 5px; }
        .preview-img { max-width: 100%; max-height: 150px; margin-top: 10px; border-radius: 4px; display: none; border: 1px dashed #cbd5e1; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .track-box { margin-top: 25px; padding-top: 20px; border-top: 2px solid #e2e8f0; }
        .track-box h3 { color: #1e3a8a; margin-bottom: 10px; font-size: 16px; }
        .req-star { color: red; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>🛠️ System & Network Complaint Registration</h2>
    <form id="complaintForm">
        <div class="form-group">
            <label for="userName">Employee Name (பணியாளர் பெயர்): <span class="req-star">*</span></label>
            <input type="text" id="userName" required placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="designation">Designation (பதவி): <span class="req-star">*</span></label>
            <select id="designation" required>
                <option value="">--Select Designation--</option>
                <option value="A.E (Assistant Engineer)">A.E (Assistant Engineer)</option>
                <option value="J.E (Junior Engineer)">J.E (Junior Engineer)</option>
                <option value="Foreman">Foreman</option>
                <option value="R.S">R.S</option>
                <option value="C.I">C.I</option>
                <option value="Gangman">Gangman</option>
            </select>
        </div>

        <div class="form-group">
            <label for="sectionName">Section (பிரிவு): <span class="req-star">*</span></label>
            <input type="text" id="sectionName" required placeholder="Enter your Section name (e.g., Spinning, Office)">
        </div>

        <div class="form-group">
            <label for="component">Component / Issue (பிரச்சனை உள்ள பொருள்): <span class="req-star">*</span></label>
            <select id="component" required>
                <option value="">--Select Computer / Network Issue--</option>
                <option value="Motherboard Issue">Motherboard Issue</option>
                <option value="Keyboard & Mouse Issue">Keyboard & Mouse Issue</option>
                <option value="SMPS Issue">SMPS Issue</option>
                <option value="Monitor Issue">Monitor Issue</option>
                <option value="Network Issue">Network Issue</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Grievance Description (புகாரின் விபரம்): <span class="req-star">*</span></label>
            <textarea id="description" required placeholder="Briefly describe the issue..."></textarea>
        </div>

        <div class="form-group">
            <label>Material Photo (பொருள் புகைப்படம்): <span class="req-star">*</span></label>
            <div class="file-input-wrapper">
                <input type="file" id="materialPhoto" required accept="image/*" onchange="previewImage(this, 'materialPreview')">
                <img id="materialPreview" class="preview-img" alt="Material Preview">
            </div>
        </div>

        <div class="form-group">
            <label>ELCB Available & Working? (ELCB வேலை செய்கிறதா?): <span class="req-star">*</span></label>
            <div class="radio-group">
                <label><input type="radio" name="elcb" value="Yes" checked onchange="toggleElcbPhotoRequirement(this.value)"> Yes</label>
                <label><input type="radio" name="elcb" value="No" onchange="toggleElcbPhotoRequirement(this.value)"> No</label>
            </div>
        </div>

        <div class="form-group">
            <label id="elcbPhotoLabel">ELCB Photo: <span class="req-star" id="elcbStar">*</span></label>
            <div class="file-input-wrapper">
                <input type="file" id="elcbPhoto" required accept="image/*" onchange="previewImage(this, 'elcbPreview')">
                <img id="elcbPreview" class="preview-img" alt="ELCB Preview">
            </div>
        </div>

        <div class="form-group">
            <label for="earthCondition">Earth Condition (எர்த் நிலை): <span class="req-star">*</span></label>
            <select id="earthCondition" required>
                <option value="">-- Select Earth Condition --</option>
                <option value="Good">Good (சரி)</option>
                <option value="Bad">Bad (பழுது)</option>
                <option value="No Earth">No Earth (இல்லை)</option>
            </select>
        </div>

        <button type="submit" id="submitBtn">🚀 Submit Ticket to Cloud</button>
    </form>

    <div class="track-box">
        <h3>🔍 Track Ticket Status (புகாரின் நிலை அறிதல்)</h3>
        <div style="display: flex; gap: 10px;">
            <input type="text" id="searchId" placeholder="Enter Reference Number (e.g., REG571432)">
            <button style="width: auto; padding: 0 20px;" onclick="trackTicketStatus()">Check Status</button>
        </div>
        <div id="trackResult"></div>
    </div>
</div>

<script>
    let materialBase64 = "";
    let elcbBase64 = "";
    let allComplaints = [];

    window.onload = loadLiveData;
    async function loadLiveData() {
        try {
            const response = await fetch('/api/complaints');
            allComplaints = await response.json();
        } catch (e) { console.log("Failed to load cloud data."); }
        toggleElcbPhotoRequirement("Yes");
    }

    function toggleElcbPhotoRequirement(val) {
        const elcbInput = document.getElementById('elcbPhoto');
        const elcbStar = document.getElementById('elcbStar');
        if(val === "Yes") {
            elcbInput.required = true;
            elStar = "inline";
            if (elcbStar) elcbStar.style.display = "inline";
        } else {
            elcbInput.required = false;
            if (elcbStar) elcbStar.style.display = "none";
        }
    }

    function previewImage(input, previewId) {
        const preview = document.getElementById(previewId);
        const file = input.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.src = e.target.result;
                preview.style.display = 'block';
                if(previewId === 'materialPreview') materialBase64 = e.target.result;
                if(previewId === 'elcbPreview') elcbBase64 = e.target.result;
            }
            reader.readAsDataURL(file);
        }
    }

    document.getElementById('complaintForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "⏳ Saving to Cloud Database...";

        const ticketId = "REG" + Math.floor(100000 + Math.random() * 900000);
        
        const now = new Date();
        const options = { timeZone: 'Asia/Kolkata', day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true };
        const formattedDate = now.toLocaleString('en-IN', options).replace(/\//g, '-');
        
        const rawMonth = String(now.getMonth() + 1).padStart(2, '0');
        const rawYear = String(now.getFullYear());

        const payload = {
            id: ticketId,
            user_name: document.getElementById('userName').value,
            designation: document.getElementById('designation').value,
            section_name: document.getElementById('sectionName').value,
            component: document.getElementById('component').value,
            description: document.getElementById('description').value,
            material_photo: materialBase64,
            elcb: document.querySelector('input[name="elcb"]:checked').value,
            elcb_photo: document.querySelector('input[name="elcb"]:checked').value === "Yes" ? elcbBase64 : "",
            earth: document.getElementById('earthCondition').value,
            status: "Pending",
            action_taken: "",
            date: formattedDate,
            rawMonth: rawMonth,
            rawYear: rawYear
        };

        try {
            const response = await fetch('/api/complaints', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                alert(`🎉 Ticket registered successfully!\nYour Reference Number: ${ticketId}`);
                location.reload();
            } else {
                alert("⚠️ Error saving to cloud database!");
                btn.disabled = false;
                btn.innerText = "🚀 Submit Ticket to Cloud";
            }
        } catch (err) {
            alert("⚠️ Connection Failed!");
            btn.disabled = false;
            btn.innerText = "🚀 Submit Ticket to Cloud";
        }
    });

    // 🔄 டிராக் ரிசல்டில் Employee Name சேர்க்கும் லாஜிக் அண்ணே
    function trackTicketStatus() {
        const searchId = document.getElementById('searchId').value.trim();
        const resultDiv = document.getElementById('trackResult');
        
        if(!searchId) { alert("Please enter Reference Number!"); return; }
        
        const ticket = allComplaints.find(c => c.id === searchId);
        
        if(ticket) {
            let actionPart = 'No Action Logged Yet';
            let timePart = '';
            
            if (ticket.action_taken) {
                if (ticket.action_taken.includes('|')) {
                    let parts = ticket.action_taken.split('|');
                    actionPart = parts[0].trim();
                    timePart = `<br><strong>Closing Time:</strong> <span style="color:#4b5563;">${parts[1].replace('Closing Time:', '').trim()}</span>`;
                } else {
                    actionPart = ticket.action_taken;
                }
            }

            resultDiv.innerHTML = `
                <div style="margin-top:15px; padding:15px; background:#f8fafc; border:1px solid #e2e8f0; border-radius:6px; text-align:left;">
                    <p style="margin-bottom:5px;"><strong>Ticket ID:</strong> ${ticket.id}</p>
                    <p style="margin-bottom:5px;"><strong>Employee Name (பெயர்):</strong> ${ticket.user_name || 'N/A'}</p>
                    <p style="margin-bottom:5px;"><strong>Date & Time:</strong> ${ticket.date}</p>
                    <p style="margin-bottom:8px;"><strong>Status:</strong> <span style="padding:2px 6px; background:#b45309; color:white; font-weight:bold; border-radius:4px; font-size:12px;">${ticket.status}</span></p>
                    <p style="margin-top:10px; border-top:1px dashed #cbd5e1; padding-top:10px; font-size:13px;">
                        🤖 <span style="color:#16a34a; font-weight:bold;">IT Team Action Taken:</span> ${actionPart}
                        ${timePart}
                    </p>
                </div>
            `;
        } else {
            resultDiv.innerHTML = `<p style="color:red; margin-top:15px; font-weight:bold;">⚠️ Ticket ID Not Found in Cloud DB!</p>`;
        }
    }
</script>
</body>
</html>
