<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Complaint Management System</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: #f3f4f6; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .form-container { background: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { text-align: center; color: #1e3a8a; margin-bottom: 20px; border-bottom: 2px solid #1d4ed8; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #4b5563; }
        input[type="text"], select, textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        .radio-group { display: flex; gap: 15px; margin-top: 5px; }
        .radio-group label { font-weight: normal; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
        .file-input-wrapper { display: flex; flex-direction: column; gap: 5px; }
        .preview-img { max-width: 100%; max-height: 150px; margin-top: 10px; border-radius: 4px; display: none; border: 1px dashed #cbd5e1; }
        button { width: 100%; padding: 12px; background-color: #2563eb; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #1d4ed8; }
        .track-box { margin-top: 25px; padding-top: 20px; border-top: 2px solid #e2e8f0; }
        .track-box h3 { color: #1e3a8a; margin-bottom: 10px; font-size: 16px; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>🛠️ AMC Complaint Registration</h2>
    <form id="complaintForm">
        <div class="form-group">
            <label for="userName">Employee Name (பணியாளர் பெயர்):</label>
            <input type="text" id="userName" required placeholder="Enter your name">
        </div>

        <div class="form-group">
            <label for="designation">Designation (பதவி):</label>
            <input type="text" id="designation" required placeholder="e.g., Operator, Supervisor">
        </div>

        <div class="form-group">
            <label for="sectionName">Section (பிரிவு):</label>
            <select id="sectionName" required>
                <option value="">--Select Section--</option>
                <option value="Spinning">Spinning</option>
                <option value="Weaving">Weaving</option>
                <option value="Processing">Processing</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Office">Office</option>
            </select>
        </div>

        <div class="form-group">
            <label for="component">Component / Issue (பிரச்சனை உள்ள பொருள்):</label>
            <select id="component" required>
                <option value="">--Select Component--</option>
                <option value="UPS / Inverter">UPS / Inverter</option>
                <option value="Battery">Battery</option>
                <option value="Air Conditioner (AC)">Air Conditioner (AC)</option>
                <option value="Water Purifier (RO)">Water Purifier (RO)</option>
                <option value="CCTV Camera">CCTV Camera</option>
                <option value="Fire Extinguisher">Fire Extinguisher</option>
                <option value="Other Machinery">Other Machinery</option>
            </select>
        </div>

        <div class="form-group">
            <label for="description">Grievance Description (புகாரின் விபரம்):</
