<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support - Hardware & Software Grievance</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        h2, h3 { text-align: center; color: #333; }
        label { font-weight: bold; display: block; margin-top: 10px; }
        input, textarea, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #28a745; color: white; border: none; border-radius: 4px; font-size: 16px; margin-top: 15px; cursor: pointer; }
        button:hover { background-color: #218838; }
        .status-box { margin-top: 20px; padding: 15px; border: 2px solid #28a745; background-color: #d4edda; color: #155724; border-radius: 5px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 IT Support Grievance Form</h2>
    <form id="grievanceForm">
        <label for="name">👤 Name:</label>
        <input type="text" id="name" required placeholder="Enter your name">

        <label for="details">📄 Complaint Details:</label>
        <textarea id="details" rows="4" required placeholder="Describe your issue (e.g., Mouse not working)"></textarea>

        <button type="submit">Submit Complaint</button>
    </form>

    <hr style="margin: 30px 0; border: 0; border-top: 1px solid #ccc;">

    <h3>🔍 Track Ticket Status</h3>
    <input type="text" id="ticketIdInput" placeholder="Enter your 6-digit Ticket ID">
    <button type="button" id="checkStatusBtn" style="background-color: #007bff;">Check Status</button>

    <div id="statusResult" class="status-box">
        <h4>📋 Complaint Details:</h4>
        <p><strong>👤 Name:</strong> <span id="resName"></span></p>
        <p><strong>📄 Description:</strong> <span id="resDesc"></span></p>
        <p><strong>⚡ Status:</strong> <span id="resStatus"></span></p>
    </div>
</div>

<script>
    const API_URL = "https://it-hardware-support.onrender.com/api/complaint";

    // 1. புதிய புகாரை சப்மிட் செய்யும் பகுதி
    document.getElementById('grievanceForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const details = document.getElementById('details').value;

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, details, photoInfo: "" })
            });

            const data = await response.json();
            if (data.success) {
                alert(`✓ Complaint Submitted Successfully!\n🎯 Your Ticket ID is: ${data.id}`);
                document.getElementById('ticketIdInput').value = data.id;
                document.getElementById('grievanceForm').reset();
            } else {
                alert("Error: " + data.error);
            }
        } catch (error) {
            console.error("Error submitting complaint:", error);
            alert("❌ Server Connection Error! Try again.");
        }
    });

    // 2. டிக்கெட் ஸ்டேட்டஸை தேடும் பகுதி
    document.getElementById('checkStatusBtn').addEventListener('click', async () => {
        const ticketId = document.getElementById('ticketIdInput').value.trim();
        if (!ticketId) {
            alert("Please enter a Ticket ID");
            return;
        }

        try {
            const response = await fetch(`${API_URL}/${ticketId}`);
            if (response.status === 404) {
                alert("❌ Ticket Not Found! Please check the ID.");
                document.getElementById('statusResult').style.display = 'none';
                return;
            }

            const data = await response.json();
            if (data && data.length > 0) {
                // டேட்டாபேஸ்ல இருந்து வர்ற முதல் மதிப்பை எடுக்கிறோம்
                const ticket = data[0]; 
                
                document.getElementById('resName').innerText = ticket.name || "N/A";
                document.getElementById('resDesc').innerText = ticket.description || "N/A";
                document.getElementById('resStatus').innerText = ticket.status || "Pending";
                
                // பச்சை பாக்ஸை ஸ்கிரீனில் காட்டுகிறோம்
                document.getElementById('statusResult').style.display = 'block';
            } else {
                alert("❌ Ticket Not Found!");
                document.getElementById('statusResult').style.display = 'none';
            }
        } catch (error) {
            console.error("Error fetching status:", error);
            alert("❌ Error connecting to server!");
        }
    });
</script>

</body>
</html>
