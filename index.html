<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support Grievance System</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f6f9;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h2 {
            color: #1e3a8a;
            margin-bottom: 20px;
            font-size: 24px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: 600;
            color: #374151;
        }
        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #fff;
        }
        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        .track-section {
            margin-top: 35px;
            border-top: 2px solid #e5e7eb;
            padding-top: 20px;
        }
        .track-section h3 {
            color: #1e3a8a;
            font-size: 20px;
            margin-bottom: 15px;
        }
        #checkStatusBtn {
            background-color: #1f2937;
        }
        #checkStatusBtn:hover {
            background-color: #111827;
        }
        .status-box {
            margin-top: 25px;
            padding: 15px;
            border: 2px solid #28a745;
            background-color: #d4edda;
            color: #155724;
            border-radius: 6px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💻 IT Support (தகவல் தொழில்நுட்ப ஆதரவு)</h2>
        
        <form id="grievanceForm">
            <label for="name">Employee Name / ID:</label>
        <input type="text" id="name" required>

            <label for="component">Select Faulty Component:</label>
            <select id="component">
                <option value="Mouse Not Working">Mouse Not Working</option>
                <option value="Keyboard Problem">Keyboard Problem</option>
                <option value="Monitor Issue">Monitor Issue</option>
                <option value="RAM Problem">RAM Problem</option>
                <option value="OS / Software Error">OS / Software Error</option>
            </select>

            <label for="details">Grievance Description:</label>
            <textarea id="details" rows="4" required placeholder="Describe the problem..."></textarea>

            <label for="photo">Upload Proof/Photo:</label>
            <input type="file" id="photo">

            <button type="submit">Submit Ticket to IT Team</button>
        </form>

        <div class="track-section">
            <h3>🔍 Track Ticket Status (புகாரின் நிலை அறிதல்)</h3>
            <label for="ticketIdInput">Enter Complaint Reference Number:</label>
            <input type="text" id="ticketIdInput" placeholder="e.g., 766644">
            <button type="button" id="checkStatusBtn">Check Status</button>
        </div>

        <div id="statusResult" class="status-box">
            <h4>📋 Complaint Details:</h4>
            <p><strong>👤 Name:</strong> <span id="resName"></span></p>
            <p><strong>📄 Description:</strong> <span id="resDesc"></span></p>
            <p><strong>⚡ Status:</strong> <span id="resStatus"></span></p>
        </div>
    </div>

    <script>
        const API_URL = "https://online-grievance-system.onrender.com/api/complaint";

        // 1. புகாரை சப்மிட் செய்யும் பகுதி
        document.getElementById('grievanceForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const component = document.getElementById('component').value;
            const description = document.getElementById('details').value;
            
            const details = `[${component}] ${description}`;

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, details })
                });

                const data = await response.json();
                if (data.success) {
                    alert(`✓ Ticket Raised Successfully!\nYour Complaint Reference Number is: ${data.id}`);
                    document.getElementById('ticketIdInput').value = data.id;
                    document.getElementById('grievanceForm').reset();
                } else {
                    alert("Error: " + data.error);
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Server Connection Error!");
            }
        });

        // 2. ஸ்டேட்டஸ் செக் செய்யும் பகுதி
        document.getElementById('checkStatusBtn').addEventListener('click', async () => {
            const trackId = document.getElementById('ticketIdInput').value.trim();
            if (!trackId) {
                alert("Please enter a Complaint Reference Number");
                return;
            }

            try {
                const response = await fetch(`${API_URL}/${trackId}`);
                if (response.status === 404) {
                    alert("❌ Ticket Not Found!");
                    document.getElementById('statusResult').style.display = 'none';
                    return;
                }

                const data = await response.json();
                if (data && data.length > 0) {
                    const ticket = data[0];
                    
                    document.getElementById('resName').innerText = ticket.title || "N/A";
                    document.getElementById('resDesc').innerText = ticket.description || "N/A";
                    document.getElementById('resStatus').innerText = ticket.status || "Pending";
                    
                    document.getElementById('statusResult').style.display = 'block';
                } else {
                    alert("❌ Ticket Not Found!");
                    document.getElementById('statusResult').style.display = 'none';
                }
            } catch (error) {
                console.error("Error:", error);
                alert("❌ Connection Error!");
            }
        });
    </script>

</body>
</html>
