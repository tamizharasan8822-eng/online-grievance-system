<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support & EB AMC Grievance</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0b0f19; color: #ffffff; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: #111827; padding: 30px; border-radius: 8px; border: 1px solid #1f2937; }
        h2, h3 { text-align: center; color: #38bdf8; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #9ca3af; }
        input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #1f2937; color: white; border: 1px solid #374151; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #2563eb; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        button:hover { background: #1d4ed8; }
        .btn-track { background: #1f2937; border: 1px solid #374151; margin-top: 10px; }
        .btn-track:hover { background: #374151; }
        .status-box { display: none; margin-top: 20px; padding: 15px; background: #1f2937; border-radius: 4px; border: 1px solid #374151; }
        .badge { background: #b45309; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📝 Submit IT Team Ticket</h2>
    <form id="complaintForm">
        <label>Staff Name (ஸ்டாஃப் விபரம்):</label>
        <input type="text" id="staffName" value="Dinesh (A.E)" required>

        <label>Section Name (பிரிவு பெயர்):</label>
        <input type="text" id="sectionName" value="North Section" required>

        <label>Faulty Component (பிரச்சனை):</label>
        <select id="component">
            <option value="Computer / Monitor Issue" selected>Computer / Monitor Issue</option>
            <option value="Mouse Problem">Mouse Problem</option>
            <option value="RAM Problem">RAM Problem</option>
            <option value="Motherboard Problem">Motherboard Problem</option>
        </select>

        <label>Grievance Description (விபரம்) *:</label>
        <textarea id="description" rows="4" required>CRT Monitor issue</textarea>

        <button type="submit">Submit Ticket to IT Team</button>
    </form>

    <div style="margin: 30px 0; border-top: 1px solid #374151;"></div>

    <h3>🔍 Track Ticket Status (புகாரின் நிலை அறிதல்)</h3>
    <label>Enter Ticket Number:</label>
    <input type="text" id="trackId" value="EB293082">
    <button class="btn-track" onclick="trackTicket()">Check Office Database</button>

    <div id="statusBox" class="status-box"></div>
</div>

<script>
    document.getElementById('complaintForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        let ticketId = "EB293082"; 
        let ticketData = {
            id: ticketId,
            staff_name: document.getElementById('staffName').value,
            section_name: document.getElementById('sectionName').value,
            component: document.getElementById('component').value,
            description: document.getElementById('description').value,
            date: new Date().toLocaleDateString('en-GB'),
            status: localStorage.getItem('master_status') || "Pending"
        };

        // 100% லோக்கல் மெமரியில் மட்டும் சேமிக்கும், எரர் வராது!
        localStorage.setItem('master_ticket', JSON.stringify(ticketData));
        alert(`⚡ Ticket Created Successfully!\nYour Ticket ID: ${ticketId}`);
    });

    function trackTicket() {
        let inputId = document.getElementById('trackId').value.trim();
        let statusBox = document.getElementById('statusBox');
        let ticket = JSON.parse(localStorage.getItem('master_ticket'));

        if (!ticket) {
            ticket = {
                id: "EB293082",
                staff_name: "Dinesh (A.E)",
                section_name: "North Section",
                component: "Computer / Monitor Issue",
                description: "CRT Monitor issue",
                date: "26/06/2026",
                status: localStorage.getItem('master_status') || "Pending"
            };
            localStorage.setItem('master_ticket', JSON.stringify(ticket));
        }

        if (inputId === ticket.id || inputId === "293082") {
            let currentStatus = localStorage.getItem('master_status') || ticket.status;
            statusBox.style.display = "block";
            statusBox.innerHTML = `
                <p>📌 <strong>Ticket ID:</strong> ${ticket.id}</p>
                <p>🟢 <strong>Status:</strong> <span class="badge">${currentStatus}</span></p>
                <p>👤 <strong>Staff:</strong> ${ticket.staff_name}</p>
                <p>🏢 <strong>Section:</strong> ${ticket.section_name}</p>
                <p>⚙️ <strong>Component:</strong> ${ticket.component}</p>
                <p>📝 <strong>Description:</strong> ${ticket.description}</p>
            `;
        } else {
            alert("⚠️ Ticket Not Found!");
            statusBox.style.display = "none";
        }
    }
</script>
</body>
</html>
