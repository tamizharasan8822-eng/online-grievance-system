<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Complaint Report for Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        h2 {
            color: #38bdf8;
            text-align: center;
            border-bottom: 2px solid #334155;
            padding-bottom: 15px;
        }
        .subtitle {
            text-align: center;
            color: #94a3b8;
            font-size: 18px;
            margin-bottom: 25px;
        }
        .filter-section {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 25px;
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            border: 1px solid #334155;
        }
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .filter-group label {
            font-size: 14px;
            color: #38bdf8;
            font-weight: bold;
        }
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-weight: bold;
            outline: none;
        }
        .btn-download {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
        }
        .btn-download:hover {
            background-color: #059669;
        }
        .btn-update {
            background-color: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-delete {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #1e293b;
        }
        th, td {
            padding: 14px;
            text-align: left;
            border: 1px solid #334155;
        }
        th {
            background-color: #0f172a;
            color: #38bdf8;
        }
        tr:hover {
            background-color: #334155;
        }
        .badge {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 13px;
        }
        .badge-pending { background-color: #b45309; color: #fef3c7; }
        .badge-resolved { background-color: #047857; color: #d1fae5; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 AMC Complaint Report for Admin Panel</h2>
    <div class="subtitle">ஆபீஸ் ஸ்டாஃப் பதிவு செய்த அனைத்து புகார்களின் விபரம்:</div>
    
    <div class="filter-section">
        <div class="filter-group">
            <label>மாதம் தேர்ந்தெடு (Select Month):</label>
            <select id="monthFilter" onchange="filterComplaints()">
                <option value="All">அனைத்து மாதங்கள் (All)</option>
                <option value="01">ஜனவரி (January)</option>
                <option value="02">பிப்ரவரி (February)</option>
                <option value="03">மார்ச் (March)</option>
                <option value="04">ஏப்ரல் (April)</option>
                <option value="05">மே (May)</option>
                <option value="06">ஜூன் (June)</option>
                <option value="07">ஜூலை (July)</option>
                <option value="08">ஆகஸ்ட் (August)</option>
                <option value="09">செப்டம்பர் (September)</option>
                <option value="10">அக்டோபர் (October)</option>
                <option value="11">நவம்பர் (November)</option>
                <option value="12">டிசம்பர் (December)</option>
            </select>
        </div>
        
        <div class="filter-group">
            <label>வருடம் தேர்ந்தெடு (Select Year):</label>
            <select id="yearFilter" onchange="filterComplaints()">
                <option value="2026">2026</option>
                <option value="2027">2027</option>
            </select>
        </div>

        <button class="btn-download" onclick="downloadPDF()">📄 PDF அறிக்கை பதிவிறக்கம் (Download Report)</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>புகார் ID</th>
                <th>ஸ்டாஃப் விபரம்</th>
                <th>பிரிவு பெயர்</th>
                <th>பிரச்சனை (Component)</th>
                <th>விபரம் (Description)</th>
                <th>தேதி</th>
                <th>தற்போதைய நிலை</th>
                <th>செயல்பாடுகள் (Actions)</th>
            </tr>
        </thead>
        <tbody id="complaintTableBody">
            <!-- ஆன்லைன் கிளவுட் புகார்கள் இங்கே வரும் -->
        </tbody>
    </table>
</div>

<script>
    const ONLINE_API_URL = 'https://online-grievance-system.onrender.com/api/all-complaints';
    let allComplaints = [];

    async function loadComplaints() {
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Loading cloud database...</td></tr>';
        
        try {
            const response = await fetch(ONLINE_API_URL); 
            if (!response.ok) throw new Error('Server issues');
            allComplaints = await response.json();
            filterComplaints();
        } catch (error) {
            console.log("Error:", error);
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color: #ef4444; font-weight: bold;">டேட்டாபேஸ் கனெக்ட் ஆகல அண்ணே!</td></tr>';
        }
    }

    // தேதி சரியாக ஃபில்டர் ஆக ஜாவாஸ்கிரிப்ட் அப்டேட்
    function filterComplaints() {
        const month = document.getElementById('monthFilter').value;
        const year = document.getElementById('yearFilter').value;
        
        let filtered = allComplaints;

        // வருட ஃபில்டர்
        filtered = filtered.filter(t => {
            let rDate = t.date || t.created_at || t.createdAt || '';
            return String(rDate).includes(year);
        });

        // மாத ஃபில்டர்
        if (month !== 'All') {
            filtered = filtered.filter(t => {
                let rDate = t.date || t.created_at || t.createdAt || '';
                return String(rDate).includes(`-${month}-`);
            });
        }
        
        displayData(filtered);
    }

    function displayData(complaints) {
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '';

        if(complaints.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; font-weight: bold; color: #f59e0b;">புகார்கள் எதுவும் இல்லை அண்ணே!</td></tr>';
            return;
        }

        complaints.forEach(ticket => {
            // 🛠️ அண்ணே, உங்க டேட்டாபேஸ் காலம்களை இங்க பக்காவா மேட்ச் பண்ணிருக்கேன்!
            let staffName = ticket.staff_name || ticket.staffName || ticket.employee_name || ticket.employeeName || 'Jayakumar';
            let sectionName = ticket.section_name || ticket.sectionName || ticket.department || ticket.section || 'N/A';
            let component = ticket.component || ticket.issue_type || ticket.title || 'N/A';
            let description = ticket.description || 'N/A';
            
            // தேதி ஃபார்மேட் சரிசெய்தல்
            let rawDate = ticket.date || ticket.created_at || ticket.createdAt || 'N/A';
            let displayDate = rawDate.includes('T') ? rawDate.split('T')[0] : rawDate;

            // இப்போ டிஸ்கிரிப்ஷன்ல இருக்குற பிராக்கெட் வார்த்தையை பிரச்சனைக்கு மாத்துறோம் (ஒருவேளை பிரச்சனை N/A ஆ இருந்தா)
            if((component === 'N/A' || component === '') && description.startsWith('[')) {
                let closingBracket = description.indexOf(']');
                if(closingBracket > 0) {
                    component = description.substring(1, closingBracket);
                }
            }

            const row = `
                <tr>
                    <td><strong>EB${ticket.id}</strong></td>
                    <td>${staffName}<br><span style="font-size:11px; color:#94a3b8;">A.E</span></td>
                    <td>${sectionName}</td>
                    <td><span style="color:#38bdf8; font-weight:bold;">${component}</span></td>
                    <td>${description}</td>
                    <td>${displayDate}</td>
                    <td>
                        <span class="badge ${ticket.status === 'Resolved' || ticket.status === 'Resolved & Closed' ? 'badge-resolved' : 'badge-pending'}">
                            ${ticket.status || 'Pending'} ${ticket.status === 'Resolved' || ticket.status === 'Resolved & Closed' ? '✅' : '⏳'}
                        </span>
                    </td>
                    <td>
                        <select id="status-${ticket.id}" style="padding:4px; font-size:12px; background:#1e293b; color:white; border-radius:4px;">
                            <option value="Pending" ${ticket.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="In Progress" ${ticket.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option value="Resolved & Closed" ${ticket.status === 'Resolved' || ticket.status === 'Resolved & Closed' ? 'selected' : ''}>Resolved & Closed</option>
                        </select>
                        <button class="btn-update" onclick="updateStatus(${ticket.id})">Update</button>
                        <button class="btn-delete" onclick="deleteComplaint(${ticket.id})">Delete</button>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    async function updateStatus(id) {
        const newStatus = document.getElementById(`status-${id}`).value;
        try {
            const response = await fetch(`https://online-grievance-system.onrender.com/api/complaint/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            if(response.ok) {
                alert(`Ticket #EB${id} அந்தஸ்து ஆன்லைனில் மாற்றப்பட்டது!`);
                loadComplaints();
            }
        } catch (err) {
            alert(`அப்டேட் செய்ய முடியவில்லை அண்ணே!`);
        }
    }

    async function deleteComplaint(id) {
        if(!confirm("இந்த புகாரை நீக்கலாமா அண்ணே?")) return;
        try {
            const response = await fetch(`https://online-grievance-system.onrender.com/api/complaint/${id}`, {
                method: 'DELETE'
            });
            if(response.ok) {
                alert("புகார் வெற்றிகரமாக நீக்கப்பட்டது!");
                loadComplaints();
            }
        } catch (err) {
            alert("நீக்க முடியவில்லை அண்ணே!");
        }
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("AMC Complaint Report", 14, 16);
        doc.autoTable({
            html: 'table',
            startY: 20,
        });
        doc.save("AMC_Complaint_Report.pdf");
    }

    window.onload = loadComplaints;
</script>

</body>
</html>
