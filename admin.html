<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Complaint Report for Admin Panel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }
        .admin-box {
            max-width: 1200px;
            margin: 0 auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }
        h2 { text-align: center; color: #38bdf8; }
        p.subtitle { text-align: center; color: #94a3b8; }
        
        .filter-section {
            background: #0f172a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: center;
            flex-wrap: wrap;
        }
        select, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            font-size: 14px;
        }
        .pdf-btn {
            background-color: #10b981;
            cursor: pointer;
            font-weight: bold;
            border: none;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            background: #0f172a;
        }
        th, td {
            border: 1px solid #334155;
            padding: 12px;
            text-align: left;
        }
        th { background-color: #1e293b; color: #38bdf8; }
        .status-badge {
            background: #f59e0b;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="admin-box">
        <h2>📊 AMC Complaint Report for Admin Panel</h2>
        <p class="subtitle">ஆபீஸ் ஸ்டாஃப் பதிவு செய்த அனைத்து புகார்களின் விபரம்:</p>

        <!-- ஃபில்டர் செக்ஷன் -->
        <div class="filter-section">
            <label>மாதம் தேர்ந்தெடு (Select Month):</label>
            <select id="monthSelect" onchange="onFilterChange()">
                <option value="All">எல்லா மாதமும் (All Months)</option>
                <option value="01">ஜனவரி (January)</option>
                <option value="02">பிப்ரவரி (February)</option>
                <option value="03">மார்ச் (March)</option>
                <option value="04">ஏப்ரல் (April)</option>
                <option value="05">மே (May)</option>
                <option value="06" selected>ஜூன் (June)</option> <!-- ஜூன் default -->
                <option value="07">ஜூலை (July)</option>
                <option value="08">ஆகஸ்ட் (August)</option>
                <option value="09">செப்டம்பர் (September)</option>
                <option value="10">அக்டோபர் (October)</option>
                <option value="11">நவம்பர் (November)</option>
                <option value="12">டிசம்பர் (December)</option>
            </select>

            <label>வருடம் தேர்ந்தெடு (Select Year):</label>
            <select id="yearSelect" onchange="onFilterChange()">
                <option value="All">எல்லா வருடமும் (All Years)</option>
                <option value="2025">2025</option>
                <option value="2026" selected>2026</option>
            </select>

            <button class="pdf-btn">📄 PDF அறிக்கை பதிவிறக்கு (Download Report)</button>
        </div>

        <!-- கம்ப்ளெய்ன்ட் டேபிள் -->
        <table>
            <thead>
                <tr>
                    <th>புகார் ID</th>
                    <th>ஸ்டாஃப் விபரம்</th>
                    <th>பிரிவு பெயர்</th>
                    <th>பிரச்சனை (Component)</th>
                    <th>விபரம் (Description)</th>
                    <th>தேதி</th>
                    <th>தற்போதைய நிலை</th>
                    <th>செயல்பாடுகள் (Actions)</th>
                </tr>
            </thead>
            <tbody id="complaintTableBody">
                <!-- டேட்டா இங்கே லோடு ஆகும் -->
            </tbody>
        </table>
    </div>

    <!-- ஜாவாஸ்கிரிப்ட் ஸ்மார்ட் கோடு -->
    <script>
        // மெயின் டிஸ்பிளே ஃபங்க்ஷன்
        function displayComplaints(filterMonth = "All", filterYear = "All") {
            // லோக்கல் ஸ்டோரேஜில் இருந்து டேட்டாவை எடுத்தல் (உங்க பழைய கீ பெயரை இங்க போடுங்க)
            const complaints = JSON.parse(localStorage.getItem('complaints')) || [];
            const tableBody = document.getElementById('complaintTableBody');
            tableBody.innerHTML = '';

            // ஸ்மார்ட் ஃபில்டர் கண்டிஷன்
            const filteredData = complaints.filter(ticket => {
                if (!ticket.date) return false;
                
                // தேதியை பிரிக்கிறோம் (Format: DD/MM/YYYY)
                const dateParts = ticket.date.split('/'); 
                const ticketMonth = dateParts[1]; // MM
                const ticketYear = dateParts[2];  // YYYY

                // "All" என்று இருந்தால் எல்லா புகார்களையும் காட்டும்
                if (filterMonth === "All" && filterYear === "All") {
                    return true;
                }
                if (filterMonth !== "All" && filterYear === "All") {
                    return ticketMonth === filterMonth;
                }
                if (filterMonth === "All" && filterYear !== "All") {
                    return ticketYear === filterYear;
                }

                // இரண்டும் மேட்ச் ஆனா மட்டும் காட்டும்
                return ticketMonth === filterMonth && ticketYear === filterYear;
            });

            // புகார்கள் இல்லை என்றால் காட்டும் மெசேஜ்
            if (filteredData.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align:center; color: #f43f5e; padding: 20px;">தேர்ந்தெடுக்கப்பட்ட தேதியில் புகார்கள் எதுவும் இல்லை!</td></tr>`;
                return;
            }

            // டேபிளில் டேட்டாவை ஒன்-பை-ஒன் காட்டுதல்
            filteredData.forEach(ticket => {
                tableBody.innerHTML += `
                    <tr>
                        <td><b>${ticket.id || 'N/A'}</b></td>
                        <td>${ticket.employeeName || 'N/A'}</td>
                        <td>${ticket.sectionName || 'N/A'}</td>
                        <td>${ticket.faultyComponent || 'N/A'}</td>
                        <td>${ticket.description || 'N/A'}</td>
                        <td>${ticket.date || 'N/A'}</td>
                        <td><span class="status-badge">${ticket.status || 'Pending ⏳'}</span></td>
                        <td><button style="cursor:pointer; background:#3b82f6; border:none; padding:5px 10px; border-radius:4px; color:white;">Update</button></td>
                    </tr>
                `;
            });
        }

        // டிராப்டவுன் மாறும்போது வேலை செய்யும்
        function onFilterChange() {
            const selectedMonth = document.getElementById('monthSelect').value;
            const selectedYear = document.getElementById('yearSelect').value;
            displayComplaints(selectedMonth, selectedYear);
        }

        // 🚀 பேஜ் ஓபன் ஆன உடனே "எல்லா புகார்களையும்" (All) காட்ட செட் பண்றோம்!
        window.onload = function() {
            displayComplaints("All", "All"); 
            
            // டிராப்டவுன் செலக்ட் பாக்ஸை "எல்லா மாதமும்" என்று மாற்றி வைக்கிறோம்
            document.getElementById('monthSelect').value = "All";
            document.getElementById('yearSelect').value = "All";
        };
    </script>
</body>
</html>
