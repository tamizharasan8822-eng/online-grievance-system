<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Complaint Report - Strict Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 16px; margin-bottom: 25px; }
        .filter-bar { display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; flex-wrap: wrap; }
        .filter-bar select { padding: 10px 15px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; font-size: 14px; }
        .btn-sync { background-color: #38bdf8; color: #0f172a; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .btn-pdf { background-color: #10b981; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 14px; text-align: left; border: 1px solid #334155; font-size: 14px; }
        th { background-color: #0f172a; color: #38bdf8; }
        tr:hover { background-color: #243249; }
        .badge { padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-pending { background-color: #b45309; color: #fef3c7; }
        .badge-resolved { background-color: #047857; color: #d1fae5; }
        .btn-delete { background:#ef4444; color:white; border:none; padding:6px 12px; border-radius:4px; cursor:pointer; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 AMC Complaint Report for Admin Panel</h2>
    <div class="subtitle">ஆபீஸ் ஸ்டாஃப் பதிவு செய்த தனித்துவமான புகார்களின் விபரம்:</div>
    
    <div class="filter-bar">
        <label>மாதம்:</label>
        <select id="monthFilter" onchange="filterData()">
            <option value="all" selected>All Months</option>
            <option value="01">January</option><option value="02">February</option>
            <option value="03">March</option><option value="04">April</option>
            <option value="05">May</option><option value="06">June</option>
            <option value="07">July</option><option value="08">August</option>
            <option value="09">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
        </select>

        <label>வருடம்:</label>
        <select id="yearFilter" onchange="filterData()">
            <option value="all" selected>All Years</option>
            <option value="2026">2026</option>
            <option value="2025">2025</option>
        </select>

        <button class="btn-sync" onclick="loadComplaints()">🔄 Force Refresh Database</button>
        <button class="btn-pdf" onclick="downloadPDF()">📄 PDF டவுன்லோட்</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>புகார் ID</th>
                <th>ஸ்டாஃப் விபரம்</th>
                <th>பிரிவு பெயர்</th>
                <th>பிரச்சனை (Component)</th>
                <th>விபரம் (Description)</th>
                <th>தேதி</th>
                <th>நிலை</th>
                <th>செயல்பாடு</th>
            </tr>
        </thead>
        <tbody id="complaintTableBody">
            </tbody>
    </table>
</div>

<script>
    let globalComplaintsData = [];

    async function loadComplaints() {
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">டேட்டாபேஸ் இணைக்கப்படுகிறது... தயவுசெய்து காத்திருக்கவும்...</td></tr>';
        
        try {
            const response = await fetch('https://online-grievance-system.onrender.com/api/all-complaints', {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
            });
            
            if (response.ok) {
                const cloudData = await response.json();
                
                // 🛑 டூப்ளிகேட்களை முழுமையாக நீக்கும் ஸ்ட்ரிக்ட் மேப் லாஜிக் அண்ணே!
                let uniqueMap = new Map();
                
                cloudData.forEach(item => {
                    // ஒரே டிஸ்கிரிப்ஷன் மற்றும் ஒரே தேதியில் இருந்தால் அதை டூப்ளிகேட்டாக கருதும்
                    let rawDesc = item.description || item.complaintDetails || '';
                    let rawDate = item.date ? new Date(item.date).toLocaleDateString('en-GB') : '26/06/2026';
                    let uniqueKey = `${rawDesc.trim()}_${rawDate}`;
                    
                    if (!uniqueMap.has(uniqueKey)) {
                        uniqueMap.set(uniqueKey, item);
                    }
                });

                globalComplaintsData = Array.from(uniqueMap.values());
            } else {
                globalComplaintsData = [];
            }
        } catch (error) {
            globalComplaintsData = [];
        }

        globalComplaintsData.sort((a,b) => (b.id - a.id));
        filterData();
    }

    function filterData() {
        const selectedMonth = document.getElementById('monthFilter').value;
        const selectedYear = document.getElementById('yearFilter').value;
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '';

        let filtered = globalComplaintsData.filter(ticket => {
            let rawDate = ticket.date || '';
            if(!rawDate) return true;

            let dateObj = new Date(rawDate);
            if(isNaN(dateObj.getTime())) return true;

            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let y = String(dateObj.getFullYear());

            if (selectedMonth !== 'all' && m !== selectedMonth) return false;
            if (selectedYear !== 'all' && y !== selectedYear) return false;
            return true;
        });

        if(filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#94a3b8;">புகார்கள் எதுவும் இல்லை அண்ணே!</td></tr>';
            return;
        }

        filtered.forEach(ticket => {
            let idDisplay = String(ticket.id).startsWith('EB') ? ticket.id : `EB${ticket.id}`;
            let name = ticket.staff_name || ticket.employeeName || 'Dinesh';
            
            // 🏢 பிரிவு பெயர் காலியாகவோ அல்லது N/A வாகவோ இருந்தால் 'North Section' என செட் செய்யும்
            let section = ticket.section_name || ticket.sectionName || '';
            if(!section || section === 'N/A') {
                section = 'North Section';
            }

            let rawDesc = ticket.description || 'N/A';
            let component = ticket.component || 'N/A';
            let cleanDesc = rawDesc;

            // 🔍 பிராக்கெட் டெக்ஸ்டை துல்லியமாகப் பிரிக்கும் லாஜிக் அண்ணே!
            if (rawDesc.includes('[') && rawDesc.includes(']')) {
                let compExtract = rawDesc.match(/\[(.*?)\]/);
                if (compExtract) {
                    component = compExtract[1] + " Problem";
                    cleanDesc = rawDesc.replace(/\[.*?\]/, '').trim();
                }
            }

            // ஒருவேளை விபரம் காலியாகி இருந்தால் பழைய விபரத்தையே வைக்கும்
            if(!cleanDesc) { cleanDesc = rawDesc; }

            let status = ticket.status || 'Pending';
            let dateStr = ticket.date ? new Date(ticket.date).toLocaleDateString('en-GB') : '26/06/2026';

            tbody.innerHTML += `
                <tr>
                    <td><strong>${idDisplay}</strong></td>
                    <td>${name}</td>
                    <td>${section}</td>
                    <td><span style="color:#38bdf8; font-weight:bold;">${component}</span></td>
                    <td>${cleanDesc}</td>
                    <td>${dateStr}</td>
                    <td><span class="badge ${status.includes('Resol') || status.includes('Closed') ? 'badge-resolved' : 'badge-pending'}">${status}</span></td>
                    <td><button class="btn-delete" onclick="deleteItem('${ticket.id}')">Delete</button></td>
                </tr>
            `;
        });
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');

        doc.setFontSize(18);
        doc.text("AMC Grievance System - Admin Complaint Report", 14, 15);
        doc.setFontSize(10);
        doc.text(`Report Generated On: ${new Date().toLocaleString()}`, 14, 22);

        const tableRows = [];
        const rows = document.querySelectorAll("#complaintTableBody tr");
        
        rows.forEach(row => {
            const rowData = [];
            const cols = row.querySelectorAll("td");
            if(cols.length > 1) {
                rowData.push(cols[0].innerText);
                rowData.push(cols[1].innerText);
                rowData.push(cols[2].innerText);
                rowData.push(cols[3].innerText);
                rowData.push(cols[4].innerText);
                rowData.push(cols[5].innerText);
                rowData.push(cols[6].innerText);
                tableRows.push(rowData);
            }
        });

        doc.autoTable({
            head: [['Ticket ID', 'Staff Details', 'Section Name', 'Component', 'Description', 'Date', 'Status']],
            body: tableRows,
            startY: 28,
            theme: 'grid',
            headStyles: { fillColor: [15, 23, 42], textColor: [56, 189, 248] },
            styles: { fontSize: 9, cellPadding: 3 }
        });

        doc.save(`AMC_Clean_Report_${new Date().toLocaleDateString()}.pdf`);
    }

    function deleteItem(id) {
        if(confirm("இந்த புகாரை நீக்கலாமா அண்ணே?")) {
            globalComplaintsData = globalComplaintsData.filter(t => String(t.id) !== String(id));
            filterData();
        }
    }

    window.onload = loadComplaints;
</script>
</body>
</html>
