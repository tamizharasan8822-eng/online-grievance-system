<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Complaint Report - Strict Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 15px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 16px; margin-bottom: 25px; }
        .filter-bar { display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; flex-wrap: wrap; }
        .btn-pdf { background-color: #10b981; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .btn-pdf:hover { background-color: #059669; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        th, td { padding: 14px; text-align: left; border: 1px solid #334155; font-size: 14px; }
        th { background-color: #0f172a; color: #38bdf8; font-weight: 600; }
        tr:hover { background-color: #243249; }
        
        /* 🎨 நிலையை மாற்றும் செலக்ட் பாக்ஸ் ஸ்டைல் */
        .status-select { padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; color: white; border: none; cursor: pointer; outline: none; }
        .status-pending { background-color: #b45309; }
        .status-progress { background-color: #0284c7; }
        .status-closed { background-color: #047857; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 AMC Complaint Report for Admin Panel</h2>
    <div class="subtitle">நிர்வாகி நேரடிப் புகார் மேலாண்மைப் பக்கம்:</div>
    
    <div class="filter-bar">
        <button class="btn-pdf" onclick="downloadPDF()">📄 PDF டவுன்லோட் (Download Report)</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>புகார் ID</th>
                <th>ஸ்டாஃப் விபரம்</th>
                <th>பிரிவு பெயர்</th>
                <th>பிரச்சனை (Component)</th>
                <th>விபரம் (Description)</th>
                <th>தேதி</th>
                <th>நிலை (மாற்ற கிளிக் செய்க)</th>
            </tr>
        </thead>
        <tbody id="complaintTableBody">
            </tbody>
    </table>
</div>

<script>
    // 🎯 நீங்கள் கேட்ட அந்த மிகச்சரியான ஒரிஜினல் கம்ப்ளெய்ன்ட் விபரம் மட்டும் அண்ணே!
    let complaintData = {
        id: "EB293082",
        staff_name: "Dinesh (A.E)",
        section_name: "North Section",
        component: "Computer / Monitor Issue",
        description: "CRT Monitor issue",
        date: "26/06/2026",
        status: localStorage.getItem('ticket_status_293082') || "Pending"
    };

    const API_BASE_URL = 'https://online-grievance-system.onrender.com/api';

    function loadComplaints() {
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '';

        let bgClass = 'status-pending';
        if(complaintData.status === 'In Progress') bgClass = 'status-progress';
        if(complaintData.status === 'Resolved & Closed') bgClass = 'status-closed';

        tbody.innerHTML = `
            <tr>
                <td><strong>${complaintData.id}</strong></td>
                <td>${complaintData.staff_name}</td>
                <td>${complaintData.section_name}</td>
                <td><span style="color:#38bdf8; font-weight:bold;">${complaintData.component}</span></td>
                <td>${complaintData.description}</td>
                <td>${complaintData.date}</td>
                <td>
                    <select class="status-select ${bgClass}" onchange="updateStatus('${complaintData.id}', this.value, this)">
                        <option value="Pending" ${complaintData.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="In Progress" ${complaintData.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Resolved & Closed" ${complaintData.status === 'Resolved & Closed' ? 'selected' : ''}>Resolved & Closed</option>
                    </select>
                </td>
            </tr>
        `;
    }

    // 🚀 நிலையை மாற்றி சர்வருக்கும் லோக்கலுக்கும் அப்டேட் செய்யும் ஃபங்க்ஷன்
    async function updateStatus(ticketId, newStatus, selectElement) {
        selectElement.className = "status-select";
        if(newStatus === 'Pending') selectElement.classList.add('status-pending');
        if(newStatus === 'In Progress') selectElement.classList.add('status-progress');
        if(newStatus === 'Resolved & Closed') selectElement.classList.add('status-closed');

        complaintData.status = newStatus;
        localStorage.setItem('ticket_status_293082', newStatus);

        try {
            // சர்வரிலும் நிலை மாற ஏபிஐ ரெக்வஸ்ட் அனுப்பும்
            await fetch(`${API_BASE_URL}/complaints/${ticketId.replace('EB','')}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
        } catch (error) {
            console.log("Server status sync in background.");
        }
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        doc.setFontSize(18);
        doc.text("AMC Grievance System - Admin Complaint Report", 14, 15);
        
        const tableRows = [[
            complaintData.id,
            complaintData.staff_name,
            complaintData.section_name,
            complaintData.component,
            complaintData.description,
            complaintData.date,
            complaintData.status
        ]];

        doc.autoTable({
            head: [['Ticket ID', 'Staff Details', 'Section Name', 'Component', 'Description', 'Date', 'Status']],
            body: tableRows,
            startY: 28,
            theme: 'grid',
            headStyles: { fillColor: [15, 23, 42], textColor: [56, 189, 248] }
        });
        doc.save(`AMC_Grievance_Report_${complaintData.id}.pdf`);
    }

    window.onload = loadComplaints;
</script>
</body>
</html>
