<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Complaint Report - Final Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 15px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 17px; margin-bottom: 25px; }
        .filter-bar { display: flex; gap: 15px; justify-content: center; align-items: center; margin-bottom: 25px; background: #0f172a; padding: 15px; border-radius: 8px; }
        .filter-bar select { padding: 8px 12px; background: #1e293b; color: white; border: 1px solid #475569; border-radius: 6px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; text-align: left; border: 1px solid #334155; }
        th { background-color: #0f172a; color: #38bdf8; }
        tr:hover { background-color: #334155; }
        .badge { padding: 4px 8px; border-radius: 4px; font-weight: bold; font-size: 12px; }
        .badge-pending { background-color: #b45309; color: #fef3c7; }
        .badge-resolved { background-color: #047857; color: #d1fae5; }
        .btn-sync { background-color: #38bdf8; color: #0f172a; border: none; padding: 10px 15px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 AMC Complaint Report for Admin Panel</h2>
    <div class="subtitle">ஆபீஸ் ஸ்டாஃப் பதிவு செய்த புதிய புகார்களின் லைவ் விபரம்:</div>
    
    <div class="filter-bar">
        <label>மாதம்:</label>
        <select id="monthFilter" onchange="filterData()">
            <option value="all" selected>All Months (அனைத்து மாதங்கள்)</option>
            <option value="01">January</option><option value="02">February</option>
            <option value="03">March</option><option value="04">April</option>
            <option value="05">May</option><option value="06">June</option>
            <option value="07">July</option><option value="08">August</option>
            <option value="09">September</option><option value="10">October</option>
            <option value="11">November</option><option value="12">December</option>
        </select>

        <label>வருடம்:</label>
        <select id="yearFilter" onchange="filterData()">
            <option value="all" selected>All Years (அனைத்து வருடங்கள்)</option>
            <option value="2026">2026</option>
            <option value="2025">2024</option>
        </select>

        <button class="btn-sync" onclick="loadComplaints()">🔄 Force Refresh Database</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>புகார் ID</th>
                <th>ஸ்டாஃப் விபரம்</th>
                <th>பிரிவு பெயர்</th>
                <th>பிரச்சனை (Component)</th>
                <th>விபரம் (Description)</th>
                <th>தேதி</th>
                <th>நிலை</th>
                <th>செயல்பாடு</th>
            </tr>
        </thead>
        <tbody id="complaintTableBody">
            </tbody>
    </table>
</div>

<script>
    let globalComplaintsData = [];

    async function loadComplaints() {
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;">Cloud Database- உடன் இணைகிறது... தயவுசெய்து காத்திருக்கவும்...</td></tr>';
        
        // 1. முதலாவதாக லோக்கல் மெமரி பேக்அப் எடுக்கிறது
        let localBackup = JSON.parse(localStorage.getItem('eb_it_amc_db_split')) || [];
        
        try {
            // No-Cache வழியில் சர்வரை ஃபோர்ஸ் ரிஃப்ரெஷ் செய்கிறோம்
            const response = await fetch('https://online-grievance-system.onrender.com/api/all-complaints', {
                cache: 'no-store',
                headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' }
            });
            
            if (response.ok) {
                const cloudData = await response.json();
                // லோக்கல் மற்றும் கிளவுட் இரண்டையும் ஒன்றாக இணைக்கிறோம் (டேட்டா மிஸ் ஆகாமல் இருக்க)
                let combined = [...cloudData];
                
                localBackup.forEach(l => {
                    if(!combined.some(c => String(c.id) === String(l.id).replace('EB',''))) {
                        combined.push(l);
                    }
                });
                
                globalComplaintsData = combined;
            } else {
                globalComplaintsData = localBackup;
            }
        } catch (error) {
            console.log("Server error, loading offline backup...");
            globalComplaintsData = localBackup;
        }

        // தேதியை லேட்டஸ்ட் முதலில் வரும்படி செய்தல்
        globalComplaintsData.sort((a,b) => (b.id - a.id));
        filterData();
    }

    function filterData() {
        const selectedMonth = document.getElementById('monthFilter').value;
        const selectedYear = document.getElementById('yearFilter').value;
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '';

        let filtered = globalComplaintsData.filter(ticket => {
            let rawDate = ticket.date || '';
            if(!rawDate) return true; // தேதி இல்லை என்றாலும் டேட்டாவை காட்டு

            let dateObj = new Date(rawDate);
            if(isNaN(dateObj.getTime())) {
                // லோக்கல் சிஸ்டம் டேட் ஸ்ட்ரிங் செக் (e.g., 26/6/2026)
                if(rawDate.includes('/')) {
                    let p = rawDate.split('/');
                    if(selectedMonth !== 'all' && String(p[1]).padStart(2,'0') !== selectedMonth) return false;
                    if(selectedYear !== 'all' && p[2] !== selectedYear) return false;
                    return true;
                }
                return true;
            }

            let m = String(dateObj.getMonth() + 1).padStart(2, '0');
            let y = String(dateObj.getFullYear());

            if (selectedMonth !== 'all' && m !== selectedMonth) return false;
            if (selectedYear !== 'all' && y !== selectedYear) return false;
            return true;
        });

        if(filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align:center; color:#94a3b8;">புகார்கள் எதுவும் இல்லை அண்ணே! ஃபில்டரை மாற்றி பார்க்கவும்.</td></tr>';
            return;
        }

        filtered.forEach(ticket => {
            let idDisplay = String(ticket.id).startsWith('EB') ? ticket.id : `EB${ticket.id}`;
            let name = ticket.staff_name || ticket.employeeName || 'Dinesh';
            let section = ticket.section_name || ticket.sectionName || 'North Section';
            let component = ticket.component || ticket.faultyComponent || 'N/A';
            let desc = ticket.description || 'N/A';
            let status = ticket.status || 'Pending';
            
            let dateStr = ticket.date ? new Date(ticket.date).toLocaleDateString('en-GB') : '26-06-2026';
            if(dateStr === 'Invalid Date') dateStr = ticket.date;

            tbody.innerHTML += `
                <tr>
                    <td><strong>${idDisplay}</strong></td>
                    <td>${name}</td>
                    <td>${section}</td>
                    <td><span style="color:#38bdf8;">${component}</span></td>
                    <td>${desc}</td>
                    <td>${dateStr}</td>
                    <td><span class="badge ${status.includes('Resol') ? 'badge-resolved' : 'badge-pending'}">${status}</span></td>
                    <td><button style="background:#ef4444; color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;" onclick="deleteItem('${ticket.id}')">Delete</button></td>
                </tr>
            `;
        });
    }

    function deleteItem(id) {
        if(confirm("நீக்கலாமா அண்ணே?")) {
            globalComplaintsData = globalComplaintsData.filter(t => String(t.id) !== String(id));
            filterData();
        }
    }

    window.onload = loadComplaints;
</script>
</body>
</html>
