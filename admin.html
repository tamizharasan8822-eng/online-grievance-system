<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMC Complaint Report - Strict Admin Panel</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #0f172a; color: #ffffff; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 12px; border: 1px solid #334155; }
        h2 { color: #38bdf8; text-align: center; border-bottom: 2px solid #334155; padding-bottom: 15px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 16px; margin-bottom: 25px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 14px; text-align: left; border: 1px solid #334155; font-size: 14px; }
        th { background-color: #0f172a; color: #38bdf8; }
        .status-select { padding: 6px 10px; border-radius: 4px; font-weight: bold; font-size: 13px; color: white; border: none; cursor: pointer; }
        .status-pending { background-color: #b45309; }
        .status-progress { background-color: #0284c7; }
        .status-closed { background-color: #047857; }
        .btn-pdf { background-color: #10b981; color: white; border: none; padding: 10px 20px; font-weight: bold; border-radius: 6px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 AMC Complaint Report for Admin Panel</h2>
    <div class="subtitle">நீங்க சொன்ன அந்த ஒரு குறிப்பிட்ட லோக்கல் லைவ் புகார் மட்டும்:</div>
    
    <div style="text-align: right; margin-bottom: 20px;">
        <button class="btn-pdf" onclick="downloadPDF()">📄 PDF டவுன்லோட்</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>புகார் ID</th>
                <th>ஸ்டாஃப் விபரம்</th>
                <th>பிரிவு பெயர்</th>
                <th>பிரச்சனை (Component)</th>
                <th>விபரம் (Description)</th>
                <th>தேதி</th>
                <th>நிலை (மாற்ற கிளிக் செய்க)</th>
            </tr>
        </thead>
        <tbody id="complaintTableBody">
            <!-- லோக்கல் டேட்டா -->
        </tbody>
    </table>
</div>

<script>
    function loadComplaints() {
        const tbody = document.getElementById('complaintTableBody');
        
        // மெமரியில் இருந்து எடுக்கும், இல்லைனா பிரெஷ்ஷாக செட் பண்ணும்
        let savedTicket = JSON.parse(localStorage.getItem('master_ticket'));
        if(!savedTicket) {
            savedTicket = {
                id: "EB293082",
                staff_name: "Dinesh (A.E)",
                section_name: "North Section",
                component: "Computer / Monitor Issue",
                description: "CRT Monitor issue",
                date: "26/06/2026",
                status: localStorage.getItem('master_status') || "Pending"
            };
            localStorage.setItem('master_ticket', JSON.stringify(savedTicket));
        }

        let bgClass = 'status-pending';
        if(savedTicket.status === 'In Progress') bgClass = 'status-progress';
        if(savedTicket.status === 'Resolved & Closed') bgClass = 'status-closed';

        tbody.innerHTML = `
            <tr>
                <td><strong>${savedTicket.id}</strong></td>
                <td>${savedTicket.staff_name}</td>
                <td>${savedTicket.section_name}</td>
                <td><span style="color:#38bdf8; font-weight:bold;">${savedTicket.component}</span></td>
                <td>${savedTicket.description}</td>
                <td>${savedTicket.date}</td>
                <td>
                    <select class="status-select ${bgClass}" onchange="updateStatus(this.value)">
                        <option value="Pending" ${savedTicket.status === 'Pending' ? 'selected' : ''}>Pending</option>
                        <option value="In Progress" ${savedTicket.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                        <option value="Resolved & Closed" ${savedTicket.status === 'Resolved & Closed' ? 'selected' : ''}>Resolved & Closed</option>
                    </select>
                </td>
            </tr>
        `;
    }

    function updateStatus(newStatus) {
        let savedTicket = JSON.parse(localStorage.getItem('master_ticket'));
        if(savedTicket) {
            savedTicket.status = newStatus;
            localStorage.setItem('master_ticket', JSON.stringify(savedTicket));
            localStorage.setItem('master_status', newStatus); // பேக்அப்
        }
        loadComplaints();
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('l', 'mm', 'a4');
        let savedTicket = JSON.parse(localStorage.getItem('master_ticket'));
        
        doc.text("AMC Admin Report", 14, 15);
        doc.autoTable({
            head: [['Ticket ID', 'Staff Details', 'Section', 'Component', 'Description', 'Date', 'Status']],
            body: [[savedTicket.id, savedTicket.staff_name, savedTicket.section_name, savedTicket.component, savedTicket.description, savedTicket.date, savedTicket.status]],
            startY: 25,
            theme: 'grid'
        });
        doc.save(`AMC_Report_${savedTicket.id}.pdf`);
    }

    window.onload = loadComplaints;
</script>
</body>
</html>
