<!DOCTYPE html>
<html lang="ta">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Support - Admin Portal (Online Cloud)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            color: #1e3a8a;
            text-align: center;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 15px;
        }
        .badge-online {
            background-color: #10b981;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 14px;
            float: right;
            font-weight: bold;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }
        th {
            background-color: #1e3a8a;
            color: white;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .status-select {
            padding: 6px;
            border-radius: 4px;
            border: 1px solid #cbd5e1;
            font-weight: bold;
        }
        .btn-refresh {
            background-color: #1e3a8a;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-refresh:hover {
            background-color: #172554;
        }
    </style>
</head>
<body>

<div class="container">
    <span class="badge-online">ONLINE CLOUD MODE</span>
    <h2>👨‍💻 Admin Control Panel (அட்மின் போர்ட்டல்)</h2>
    
    <button class="btn-refresh" onclick="loadComplaints()">🔄 Refresh Complaints</button>

    <table>
        <thead>
            <tr>
                <th>Ticket ID</th>
                <th>Employee Name</th>
                <th>Grievance Details</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="complaintTableBody">
            </tbody>
    </table>
</div>

<script>
    // அண்ணே, இப்போ உங்க Render ஆன்லைன் கிளவுட் சர்வர் லிங்க்கை இங்க செட் பண்ணிட்டேன்! 🚀
    const ONLINE_API_URL = 'https://online-grievance-system.onrender.com/api/all-complaints';

    async function loadComplaints() {
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Loading from Aiven cloud database...</td></tr>';
        
        try {
            // ஆன்லைன் Render பேக்-எண்ட் மூலமா Aiven கிளவுட் MySQL டேட்டாவை எடுக்கிறோம்
            const response = await fetch(ONLINE_API_URL); 
            if (!response.ok) throw new Error('Server issues');
            const complaints = await response.json();
            displayData(complaints);
        } catch (error) {
            console.log("Error loading cloud database:", error);
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color: #ef4444; font-weight: bold;">அண்ணே! உங்க ஆன்லைன் Render சர்வர்ல ஏதோ பிரச்சனை அல்லது டேட்டாபேஸ் கனெக்ட் ஆகல!</td></tr>';
        }
    }

    function displayData(complaints) {
        const tbody = document.getElementById('complaintTableBody');
        tbody.innerHTML = '';

        if(complaints.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; font-weight: bold; color: #f59e0b;">டேட்டாபேஸில் புகார்கள் எதுவும் இல்லை அண்ணே! புது புகார் போட்டு செக் பண்ணுங்க!</td></tr>';
            return;
        }

        // ஆன்லைன் கிளவுட்ல இருக்குற எல்லா புகார்களையும் வரிசையாகக் காட்டும்
        complaints.forEach(ticket => {
            const row = `
                <tr>
                    <td><strong>#${ticket.id}</strong></td>
                    <td>${ticket.title || ticket.employeeName || 'N/A'}</td>
                    <td>${ticket.description || 'N/A'}</td>
                    <td><span style="color: ${ticket.status === 'Pending' ? '#ef4444' : ticket.status === 'In Progress' ? '#f59e0b' : '#10b981'}; font-weight:bold;">${ticket.status || 'Pending'}</span></td>
                    <td>
                        <select class="status-select" onchange="updateStatus(${ticket.id}, this.value)">
                            <option value="Pending" ${ticket.status === 'Pending' ? 'selected' : ''}>Pending</option>
                            <option value="In Progress" ${ticket.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
                            <option value="Resolved" ${ticket.status === 'Resolved' ? 'selected' : ''}>Resolved</option>
                        </select>
                    </td>
                </tr>
            `;
            tbody.innerHTML += row;
        });
    }

    async function updateStatus(id, newStatus) {
        try {
            // ஸ்டேட்டஸ் அப்டேட்டும் ஆன்லைன் சர்வருக்கே போகும்
            const response = await fetch(`https://online-grievance-system.onrender.com/api/complaint/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: newStatus })
            });
            const result = await response.json();
            if(result.success) {
                alert(`Ticket #${id} அந்தஸ்து ஆன்லைனில் '${newStatus}' என வெற்றிகரமாக மாற்றப்பட்டது!`);
                loadComplaints();
            }
        } catch (err) {
            alert(`ஆன்லைன் டேட்டாபேஸ் உடன் இணைக்க முடியவில்லை அண்ணே!`);
        }
    }

    window.onload = loadComplaints;
</script>

</body>
</html>
